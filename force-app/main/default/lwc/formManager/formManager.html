<template>
    <div dir="rtl">
        <lightning-card title="ניהול טפסים" icon-name="standard:form">
            <lightning-button slot="actions" variant="neutral" label="מאגר טפסים כללי" title="עיון במאגר הטפסים המשותף ושכפול" icon-name="utility:apps" onclick={openGallery}></lightning-button>
            <lightning-button class="new-form-btn" slot="actions" variant="brand" label="+ צור טופס חדש" title="צור טופס חדש" onclick={newForm}></lightning-button>

            <template lwc:if={isList}>
                <div class="slds-p-around_small">
                    <template lwc:if={hasRows}>
                        <!-- search + filters toolbar -->
                        <div class="slds-grid slds-gutters_x-small slds-wrap slds-p-bottom_small">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                                <lightning-input type="search" label="חיפוש טופס" variant="label-hidden"
                                    placeholder="חיפוש לפי שם, מזהה או סוג שירות" value={search} onchange={handleSearch}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_4-of-12">
                                <lightning-combobox label="סטטוס" variant="label-hidden" value={statusFilter}
                                    options={statusFilterOptions} onchange={handleStatusFilter}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12">
                                <lightning-combobox label="סוג שירות" variant="label-hidden" value={serviceFilter}
                                    options={serviceFilterOptions} onchange={handleServiceFilter}></lightning-combobox>
                            </div>
                        </div>
                        <p class="slds-text-body_small slds-text-color_weak slds-p-bottom_xx-small" role="status" aria-live="polite">{resultCountText}</p>

                        <template lwc:if={hasFilteredRows}>
                            <div role="region" aria-label="רשימת הטפסים לניהול">
                                <lightning-datatable
                                    aria-label="רשימת הטפסים לניהול"
                                    key-field="id"
                                    data={filteredRows}
                                    columns={columns}
                                    hide-checkbox-column
                                    onrowaction={handleRowAction}>
                                </lightning-datatable>
                            </div>
                        </template>
                        <template lwc:if={noMatch}>
                            <p class="slds-text-color_weak slds-p-around_medium slds-text-align_center">
                                לא נמצאו טפסים התואמים לחיפוש/סינון.
                            </p>
                        </template>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-p-around_medium slds-text-align_center">
                            אין טפסים עדיין. לחץ על "צור טופס חדש" כדי להתחיל.
                        </p>
                    </template>
                </div>
            </template>

            <template lwc:elseif={isGallery}>
                <div class="slds-p-around_small" role="region" aria-label="מאגר טפסים כללי">
                    <button type="button" class="slds-button slds-button_neutral slds-m-bottom_x-small"
                        onclick={backToList} aria-label="חזרה לרשימת הטפסים">← חזרה לרשימת הטפסים</button>
                    <h2 class="slds-text-heading_small slds-p-bottom_x-small">מאגר הטפסים הכללי</h2>
                    <template lwc:if={hasGalleryRows}>
                        <template for:each={galleryRows} for:item="g">
                            <div key={g.id} class="slds-box slds-box_x-small slds-m-bottom_x-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div>
                                    <div class="slds-text-title_bold">{g.name}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">{g.description}</div>
                                    <template lwc:if={g.serviceType}>
                                        <div class="slds-text-body_small slds-text-color_weak">שירות: {g.serviceType}</div>
                                    </template>
                                </div>
                                <lightning-button variant="brand" label="שכפל אליי" title="צור עותק של הטופס לרשות שלי"
                                    data-id={g.id} onclick={cloneFromGallery} disabled={galleryBusy}></lightning-button>
                            </div>
                        </template>
                    </template>
                    <template lwc:if={hasGalleryRows}>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-p-around_medium slds-text-align_center">
                            אין טפסים במאגר הכללי עדיין. פרסמו טופס למאגר מתוך עורך הטופס.
                        </p>
                    </template>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-p-around_small" role="region" aria-label="עורך הטופס">
                    <button type="button" class="slds-button slds-button_neutral slds-m-bottom_x-small"
                        onclick={backToList} aria-label="חזרה לרשימת הטפסים">← חזרה לרשימת הטפסים</button>
                    <h2 class="builder-heading slds-assistive-text" tabindex="-1">עורך הטופס</h2>
                    <c-form-builder
                        record-id={editId}
                        embedded
                        onsaved={handleSaved}
                        oncancel={handleCancel}>
                    </c-form-builder>
                </div>
            </template>
        </lightning-card>
    </div>
</template>
