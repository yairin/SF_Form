<template>
    <div dir="rtl">
        <lightning-card title="ניהול טפסים" icon-name="standard:form">
            <lightning-button slot="actions" variant="brand" label="+ צור טופס חדש" onclick={newForm}></lightning-button>

            <template lwc:if={isList}>
                <div class="slds-p-around_small">
                    <template lwc:if={hasRows}>
                        <lightning-datatable
                            key-field="id"
                            data={rows}
                            columns={columns}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                        </lightning-datatable>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-p-around_medium slds-text-align_center">
                            אין טפסים עדיין. לחץ על "צור טופס חדש" כדי להתחיל.
                        </p>
                    </template>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-p-around_small">
                    <c-form-builder
                        record-id={editId}
                        embedded
                        onsaved={handleSaved}
                        oncancel={handleCancel}>
                    </c-form-builder>
                </div>
            </template>
        </lightning-card>
    </div>
</template>
