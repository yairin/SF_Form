<template>
    <div dir="rtl" class="slds-box slds-box_x-small slds-p-around_medium" style="max-width:560px;margin:0 auto;">
        <template lwc:if={reference}>
            <div class="slds-text-align_center slds-p-vertical_large" role="status" aria-live="polite">
                <lightning-icon icon-name="action:approval" size="large" alternative-text=""></lightning-icon>
                <h1 class="slds-text-heading_medium slds-p-top_small form-success-heading" tabindex="-1">נשלח בהצלחה!</h1>
                <p class="slds-p-top_x-small">תודה, הפנייה התקבלה.</p>
                <p class="slds-p-top_x-small">
                    <span>מספר סימוכין:</span>
                    <span class="slds-text-title_bold">{reference}</span>
                </p>
            </div>
        </template>

        <template lwc:else>
            <h1 class="slds-text-heading_medium slds-p-bottom_small">{formName}</h1>

            <lightning-input name="fullName" label="שם מלא" required value={fullName}
                onchange={handleChange}></lightning-input>
            <lightning-input name="email" type="email" label="אימייל" required value={email}
                onchange={handleChange}></lightning-input>
            <lightning-input name="phone" type="tel" label="טלפון" value={phone}
                onchange={handleChange}></lightning-input>

            <lightning-combobox name="track" label="בחירת מסלול" value={track}
                options={trackOptions} onchange={handleChange} placeholder="בחר מסלול">
            </lightning-combobox>

            <div class="slds-p-top_small">
                <lightning-input type="checkbox" name="needsTransport" label="צריך הסעה?"
                    checked={needsTransport} onchange={handleChange}></lightning-input>
            </div>

            <template lwc:if={showPickup}>
                <lightning-input name="pickup" label="כתובת איסוף" required value={pickup}
                    onchange={handleChange}></lightning-input>
            </template>

            <template lwc:if={error}>
                <div class="form-error slds-text-color_error slds-p-top_small" role="alert"
                    aria-live="assertive" tabindex="-1">{error}</div>
            </template>

            <div class="slds-p-top_medium">
                <lightning-button variant="brand" label="שליחת הרשמה" onclick={handleSubmit}
                    disabled={loading} aria-busy={ariaBusy}></lightning-button>
            </div>
        </template>
    </div>
</template>
