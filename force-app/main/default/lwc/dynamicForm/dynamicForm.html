<template>
    <div dir="rtl" style={containerStyle}>
        <template lwc:if={isVideoBg}>
            <video autoplay muted loop playsinline style={videoStyle}>
                <source src={bgVideoUrl} />
            </video>
        </template>
        <template lwc:if={hasOverlay}>
            <div style={overlayStyle}></div>
        </template>

        <div class="slds-box slds-box_x-small" style={cardStyle} aria-busy={ariaBusy}>
        <template lwc:if={hasBanner}>
            <img src={bannerUrl} alt="" style={bannerStyle} />
        </template>
        <template lwc:if={hasLogo}>
            <div class="slds-text-align_center slds-p-bottom_x-small">
                <img src={logoUrl} alt="לוגו" style="max-height:56px;max-width:100%;" />
            </div>
        </template>
        <template lwc:if={notFound}>
            <p class="slds-text-color_error">הטופס לא נמצא.</p>
        </template>

        <template lwc:elseif={reference}>
            <div class="slds-text-align_center slds-p-vertical_medium form-success">
                <lightning-icon icon-name="utility:success" size="large" variant="success"
                    alternative-text="הצלחה" class="form-success__icon"></lightning-icon>
                <h1 class="slds-text-heading_medium form-success-heading slds-m-top_small"
                    tabindex="-1" role="status" aria-live="polite">הבקשה נקלטה בהצלחה</h1>

                <div class="form-reference-box slds-m-vertical_medium">
                    <p class="slds-text-body_small form-reference-box__label">מספר סימוכין</p>
                    <p class="form-reference-box__value">{reference}</p>
                    <button type="button" class="slds-button slds-button_neutral slds-m-top_x-small"
                        onclick={copyReference}>
                        <lightning-icon icon-name="utility:copy" size="x-small" alternative-text=""
                            class="slds-m-left_xx-small"></lightning-icon>העתק מספר
                    </button>
                    <span class="form-reference-box__copied" role="status" aria-live="polite">{copyMessage}</span>
                </div>

                <template lwc:if={submittedEmail}>
                    <p class="slds-text-body_small slds-m-bottom_small">אישור יישלח לכתובת: {submittedEmail}</p>
                </template>

                <div class="form-next-steps slds-text-align_right slds-m-vertical_medium">
                    <p class="slds-text-title_bold slds-m-bottom_xx-small">מה קורה עכשיו?</p>
                    <ul class="slds-list_dotted">
                        <li>הבקשה הועברה לטיפול המחלקה הרלוונטית</li>
                        <li>תקבלו עדכון לגבי סטטוס הבקשה</li>
                        <li>שמרו את מספר הסימוכין לפניות עתידיות</li>
                    </ul>
                </div>

                <button type="button" class="slds-button slds-button_brand" style={brandBtnStyle}
                    onclick={printConfirmation}>
                    <lightning-icon icon-name="utility:print" size="x-small" alternative-text=""
                        class="slds-m-left_xx-small"></lightning-icon>הדפסת אישור
                </button>
            </div>
        </template>

        <template lwc:else>
            <div style={headingStyle}>
                <h1 class="slds-text-heading_medium">{title}</h1>
                <p class="slds-text-body_small slds-p-bottom_small">{description}</p>
            </div>

            <template lwc:if={hasErrorSummary}>
                <div class="form-error-summary slds-box slds-theme_error slds-m-bottom_small" role="alert"
                    tabindex="-1" aria-labelledby="err-summary-title">
                    <p id="err-summary-title" class="slds-text-title_bold">נמצאו שגיאות בטופס. נא לתקן:</p>
                    <ul class="slds-list_dotted">
                        <template for:each={errorSummaryItems} for:item="e">
                            <li key={e.key}>
                                <a href="#" data-key={e.key} onclick={focusField}>{e.label}: {e.message}</a>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <template lwc:if={isWizard}>
                <div class="slds-p-bottom_small">
                    <p class="slds-text-title_bold slds-p-bottom_xx-small" aria-live="polite">{stepProgressLabel}</p>
                    <div class="slds-progress-bar" role="progressbar" aria-label={stepProgressLabel}>
                        <span class="slds-progress-bar__value" style={progressStyle}></span>
                    </div>
                </div>
            </template>

            <template for:each={currentFieldsView} for:item="f">
                <div key={f.key} class="slds-form-element slds-p-vertical_xx-small">
                    <template lwc:if={f.isCheckbox}>
                        <label class="slds-checkbox_standalone" for={f.key}>
                            <input type="checkbox" id={f.key} data-key={f.key} aria-required={f.ariaRequired}
                                aria-invalid={f.ariaInvalid} aria-describedby={f.describedBy} onchange={handleChange} /> {f.label}
                            <template lwc:if={f.required}> <abbr class="slds-required" title="חובה">*</abbr></template>
                        </label>
                    </template>
                    <template lwc:elseif={f.isGroup}>
                        <fieldset class="slds-form-element__control form-fieldset"
                            aria-describedby={f.describedBy} aria-invalid={f.ariaInvalid}>
                            <legend class="slds-form-element__label">
                                <template lwc:if={f.required}><abbr class="slds-required" title="חובה">* </abbr></template>{f.label}
                            </legend>
                            <template lwc:if={f.isRadio}>
                                <template for:each={f.options} for:item="o">
                                    <label key={o.value} class="slds-p-right_medium">
                                        <input type="radio" data-key={f.key} name={f.key} value={o.value} onchange={handleChange} /> {o.label}
                                    </label>
                                </template>
                            </template>
                            <template lwc:else>
                                <template for:each={f.options} for:item="o">
                                    <label key={o.value} class="slds-p-right_medium">
                                        <input type="checkbox" data-key={f.key} value={o.value} onchange={handleChange} /> {o.label}
                                    </label>
                                </template>
                            </template>
                        </fieldset>
                    </template>
                    <template lwc:else>
                        <label class="slds-form-element__label" for={f.key}>
                            <template lwc:if={f.required}><abbr class="slds-required" title="חובה">* </abbr></template>{f.label}
                        </label>
                        <div class="slds-form-element__control">
                            <template lwc:if={f.isText}>
                                <input type={f.inputType} id={f.key} data-key={f.key} class="slds-input"
                                    aria-required={f.ariaRequired} aria-invalid={f.ariaInvalid}
                                    aria-describedby={f.describedBy} onchange={handleChange} />
                            </template>
                            <template lwc:elseif={f.isFile}>
                                <label class={f.dropzoneClass} for={f.key} data-dropkey={f.key}
                                    ondragover={handleDragOver} ondragenter={handleDragEnter}
                                    ondragleave={handleDragLeave} ondrop={handleDrop}>
                                    <lightning-icon icon-name="utility:upload" size="small" alternative-text=""
                                        class="slds-m-bottom_xx-small"></lightning-icon>
                                    <span class="form-dropzone__text">גררו קובץ לכאן או לחצו לבחירה</span>
                                    <span class="form-dropzone__hint">{f.acceptHint}</span>
                                    <input type="file" multiple id={f.key} data-key={f.key} accept={f.accept}
                                        class="form-file-input" aria-required={f.ariaRequired}
                                        aria-invalid={f.ariaInvalid} aria-describedby={f.describedBy}
                                        onchange={handleFileChange} />
                                </label>
                                <template lwc:if={f.status}>
                                    <template lwc:if={f.status.checking}>
                                        <div class="slds-progress-bar slds-progress-bar_x-small slds-m-top_xx-small"
                                            role="progressbar" aria-valuemin="0" aria-valuemax="100"
                                            aria-label="בודק את הקובץ">
                                            <span class="slds-progress-bar__value form-progress-indeterminate"
                                                style="width:100%"></span>
                                        </div>
                                    </template>
                                    <div class={f.status.cssClass} style="font-size:0.8rem;margin-top:0.25rem;"
                                        role="status" aria-live="polite">{f.status.message}</div>
                                </template>
                                <template lwc:if={f.fileItems}>
                                    <ul class="form-file-chips slds-m-top_x-small">
                                        <template for:each={f.fileItems} for:item="item">
                                            <li key={item.uid} class="form-file-chip">
                                                <template lwc:if={item.isImage}>
                                                    <img src={item.previewUrl} alt="" class="form-file-chip__thumb" />
                                                </template>
                                                <template lwc:else>
                                                    <lightning-icon icon-name="doctype:attachment" size="small"
                                                        alternative-text="קובץ" class="form-file-chip__icon"></lightning-icon>
                                                </template>
                                                <span class="form-file-chip__name">{item.name}</span>
                                                <span class="form-file-chip__size">{item.sizeLabel}</span>
                                                <button type="button" class="form-file-chip__remove"
                                                    data-key={f.key} data-index={item.index}
                                                    onclick={handleRemoveFile} aria-label={item.removeLabel}>
                                                    <span aria-hidden="true">×</span>
                                                </button>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </template>
                            <template lwc:elseif={f.isTextarea}>
                                <textarea id={f.key} data-key={f.key} class="slds-textarea"
                                    aria-required={f.ariaRequired} aria-invalid={f.ariaInvalid}
                                    aria-describedby={f.describedBy} onchange={handleChange}></textarea>
                            </template>
                            <template lwc:elseif={f.isSelect}>
                                <div class="slds-select_container">
                                    <select id={f.key} data-key={f.key} class="slds-select"
                                        aria-required={f.ariaRequired} aria-invalid={f.ariaInvalid}
                                        aria-describedby={f.describedBy} onchange={handleChange}>
                                        <option value="">— בחר —</option>
                                        <template for:each={f.options} for:item="o">
                                            <option key={o.value} value={o.value}>{o.label}</option>
                                        </template>
                                    </select>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={f.helpText}>
                        <div id={f.helpId} class="slds-form-element__help slds-text-color_weak">{f.helpText}</div>
                    </template>
                    <template lwc:if={f.fieldError}>
                        <div id={f.errId} class="slds-form-element__help slds-text-color_error" role="alert">{f.fieldError}</div>
                    </template>
                </div>
            </template>

            <template lwc:if={isReviewStep}>
                <div class="form-review">
                    <h2 class="slds-text-heading_small form-review-heading" tabindex="-1"
                        role="status" aria-live="polite">סקירה ואישור</h2>
                    <p class="slds-text-body_small slds-p-bottom_small">בדקו את הפרטים לפני השליחה. ניתן לחזור ולערוך כל שלב.</p>
                    <template for:each={reviewGroups} for:item="g">
                        <div key={g.id} class="form-review-group">
                            <div class="form-review-group__head">
                                <span class="slds-text-title_bold">{g.title}</span>
                                <button type="button" class="slds-button slds-button_neutral"
                                    data-step={g.index} onclick={editStep}>עריכה</button>
                            </div>
                            <template for:each={g.fields} for:item="item">
                                <div key={item.key} class="form-review-item">
                                    <span class="form-review-item__label">{item.label}:</span>
                                    <span class="form-review-item__value">{item.display}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <template lwc:if={error}>
                <div class="slds-text-color_error slds-p-top_small" role="alert">{error}</div>
            </template>

            <div class="slds-p-top_medium slds-grid slds-grid_align-spread">
                <div>
                    <template lwc:if={isWizard}>
                        <template lwc:if={isFirstStep}></template>
                        <template lwc:else>
                            <button class="slds-button slds-button_neutral" onclick={prevStep}
                                disabled={loading} aria-busy={ariaBusy}>הקודם</button>
                        </template>
                    </template>
                </div>
                <div>
                    <template lwc:if={isLastStep}>
                        <button class="slds-button slds-button_brand" style={brandBtnStyle} onclick={handleSubmit}
                            disabled={loading} aria-busy={ariaBusy}>שליחה</button>
                    </template>
                    <template lwc:else>
                        <button class="slds-button slds-button_brand" style={brandBtnStyle} onclick={nextStep}
                            disabled={loading} aria-busy={ariaBusy}>הבא</button>
                    </template>
                </div>
            </div>
        </template>
        </div>
    </div>
</template>
