<template>
    <div dir="rtl" style={containerStyle}>
        <template lwc:if={isVideoBg}>
            <video autoplay muted loop playsinline style={videoStyle}>
                <source src={bgVideoUrl} />
            </video>
        </template>
        <template lwc:if={hasOverlay}>
            <div style={overlayStyle}></div>
        </template>

        <div class="slds-box slds-box_x-small" style={cardStyle}>
        <template lwc:if={hasLogo}>
            <div class="slds-text-align_center slds-p-bottom_x-small">
                <img src={logoUrl} alt="לוגו" style="max-height:56px;max-width:100%;" />
            </div>
        </template>
        <template lwc:if={notFound}>
            <p class="slds-text-color_error">הטופס לא נמצא.</p>
        </template>

        <template lwc:elseif={reference}>
            <div class="slds-text-align_center slds-p-vertical_medium">
                <h2 class="slds-text-heading_medium">נשלח בהצלחה!</h2>
                <p class="slds-text-title_bold slds-p-top_x-small">מספר סימוכין: {reference}</p>
            </div>
        </template>

        <template lwc:else>
            <h1 class="slds-text-heading_medium">{title}</h1>
            <p class="slds-text-body_small slds-p-bottom_small">{description}</p>

            <template lwc:if={isWizard}>
                <div class="slds-p-bottom_small">
                    <p class="slds-text-title_bold slds-p-bottom_xx-small" aria-live="polite">{stepProgressLabel}</p>
                    <div class="slds-progress-bar" role="progressbar" aria-label={stepProgressLabel}>
                        <span class="slds-progress-bar__value" style={progressStyle}></span>
                    </div>
                </div>
            </template>

            <template for:each={currentFieldsView} for:item="f">
                <div key={f.key} class="slds-form-element slds-p-vertical_xx-small">
                    <template lwc:if={f.isCheckbox}>
                        <label class="slds-checkbox_standalone" for={f.key}>
                            <input type="checkbox" id={f.key} data-key={f.key} aria-required={f.ariaRequired} onchange={handleChange} /> {f.label}
                            <template lwc:if={f.required}> <abbr class="slds-required" title="חובה">*</abbr></template>
                        </label>
                    </template>
                    <template lwc:else>
                        <label class="slds-form-element__label" for={f.key}>
                            <template lwc:if={f.required}><abbr class="slds-required" title="חובה">* </abbr></template>{f.label}
                        </label>
                        <div class="slds-form-element__control">
                            <template lwc:if={f.isText}>
                                <input type={f.inputType} id={f.key} data-key={f.key} class="slds-input"
                                    aria-required={f.ariaRequired} aria-invalid={f.ariaInvalid} onchange={handleChange} />
                            </template>
                            <template lwc:elseif={f.isFile}>
                                <input type="file" multiple id={f.key} data-key={f.key} accept={f.accept} class="slds-input"
                                    aria-required={f.ariaRequired} onchange={handleFileChange} />
                                <template lwc:if={f.status}>
                                    <div class={f.status.cssClass} style="font-size:0.8rem;margin-top:0.25rem;" role="status">{f.status.message}</div>
                                </template>
                            </template>
                            <template lwc:elseif={f.isTextarea}>
                                <textarea id={f.key} data-key={f.key} class="slds-textarea"
                                    aria-required={f.ariaRequired} aria-invalid={f.ariaInvalid} onchange={handleChange}></textarea>
                            </template>
                            <template lwc:elseif={f.isSelect}>
                                <div class="slds-select_container">
                                    <select id={f.key} data-key={f.key} class="slds-select"
                                        aria-required={f.ariaRequired} aria-invalid={f.ariaInvalid} onchange={handleChange}>
                                        <option value="">— בחר —</option>
                                        <template for:each={f.options} for:item="o">
                                            <option key={o.value} value={o.value}>{o.label}</option>
                                        </template>
                                    </select>
                                </div>
                            </template>
                            <template lwc:elseif={f.isRadio}>
                                <template for:each={f.options} for:item="o">
                                    <label key={o.value} class="slds-p-right_medium">
                                        <input type="radio" data-key={f.key} name={f.key} value={o.value} onchange={handleChange} /> {o.label}
                                    </label>
                                </template>
                            </template>
                            <template lwc:elseif={f.isCheckboxGroup}>
                                <template for:each={f.options} for:item="o">
                                    <label key={o.value} class="slds-p-right_medium">
                                        <input type="checkbox" data-key={f.key} value={o.value} onchange={handleChange} /> {o.label}
                                    </label>
                                </template>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={f.helpText}>
                        <div class="slds-form-element__help slds-text-color_weak">{f.helpText}</div>
                    </template>
                    <template lwc:if={f.fieldError}>
                        <div class="slds-form-element__help slds-text-color_error" role="alert">{f.fieldError}</div>
                    </template>
                </div>
            </template>

            <template lwc:if={error}>
                <div class="slds-text-color_error slds-p-top_small" role="alert">{error}</div>
            </template>

            <div class="slds-p-top_medium slds-grid slds-grid_align-spread">
                <div>
                    <template lwc:if={isWizard}>
                        <template lwc:if={isFirstStep}></template>
                        <template lwc:else>
                            <button class="slds-button slds-button_neutral" onclick={prevStep} disabled={loading}>הקודם</button>
                        </template>
                    </template>
                </div>
                <div>
                    <template lwc:if={isLastStep}>
                        <button class="slds-button slds-button_brand" style={brandBtnStyle} onclick={handleSubmit} disabled={loading}>שליחה</button>
                    </template>
                    <template lwc:else>
                        <button class="slds-button slds-button_brand" style={brandBtnStyle} onclick={nextStep} disabled={loading}>הבא</button>
                    </template>
                </div>
            </div>
        </template>
        </div>
    </div>
</template>
