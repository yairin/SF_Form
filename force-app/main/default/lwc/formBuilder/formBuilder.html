<template>
    <div dir="rtl" class="slds-grid slds-gutters slds-wrap">
        <!-- Builder -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
            <div class="slds-box">
                <h1 class="slds-text-heading_medium slds-p-bottom_small">בונה טפסים</h1>

                <div class="slds-form-element slds-p-bottom_x-small">
                    <label class="slds-form-element__label">כותרת הטופס</label>
                    <input type="text" class="slds-input" value={title} onchange={handleTitle} placeholder="למשל: רישום לאירוע" />
                </div>
                <div class="slds-form-element slds-p-bottom_x-small">
                    <label class="slds-form-element__label">תיאור (אופציונלי)</label>
                    <input type="text" class="slds-input" value={description} onchange={handleDesc} />
                </div>
                <div class="slds-form-element slds-p-bottom_small">
                    <label class="slds-form-element__label">סוג שירות (ניתוב למחלקה + SLA)</label>
                    <div class="slds-select_container">
                        <select class="slds-select" onchange={handleServiceType}>
                            <template for:each={serviceTypes} for:item="s">
                                <option key={s.value} value={s.value}>{s.label}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- AI review configuration -->
                <div class="slds-box slds-box_xx-small slds-m-bottom_small slds-theme_shade">
                    <lightning-input type="checkbox" label="בדיקת AI לטופס זה" checked={aiEnabled} onchange={handleAiEnabled}></lightning-input>
                    <template lwc:if={aiEnabled}>
                        <div class="slds-p-top_x-small">
                            <lightning-input type="checkbox" label="בדוק שהקבצים המצורפים תואמים לנדרש" checked={aiCheckAttachments} onchange={handleAiCheckAttachments}></lightning-input>
                            <lightning-input type="checkbox" label="פנייה יזומה לפונה אם חסר מידע/מסמך" checked={aiContactApplicant} onchange={handleAiContactApplicant}></lightning-input>
                            <div class="slds-form-element slds-p-top_x-small">
                                <label class="slds-form-element__label">הנחיות נוספות ל-AI (מה לוודא)</label>
                                <textarea class="slds-textarea" value={aiInstructions} onchange={handleAiInstructions}
                                    placeholder="למשל: ודא שצורף צילום תעודת זהות קריא ואישור תושב"></textarea>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Per-form workflow tasks -->
                <div class="slds-box slds-box_xx-small slds-m-bottom_small slds-theme_shade">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <span class="slds-text-title_bold">משימות אוטומטיות לטופס</span>
                        <button class="slds-button slds-button_neutral" onclick={addTask}>+ הוסף משימה</button>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-p-vertical_xx-small">
                        לכל פנייה חדשה שתתקבל, המערכת תיצור אוטומטית את המשימות הבאות (משויכות לפנייה, מוקצות לבעל הטופס).
                    </p>
                    <template lwc:if={hasTasks}>
                        <template for:each={taskRows} for:item="t">
                            <div key={t.i} class="slds-box slds-box_xx-small slds-m-bottom_x-small slds-theme_default">
                                <div class="slds-grid slds-gutters_xx-small slds-wrap slds-grid_vertical-align-center">
                                    <div class="slds-col slds-size_6-of-12">
                                        <input type="text" class="slds-input" data-i={t.i} data-p="subject"
                                            value={t.subject} onchange={handleTask} placeholder="שם המשימה (למשל: אימות מסמכים)" />
                                    </div>
                                    <div class="slds-col slds-size_3-of-12">
                                        <select class="slds-select" data-i={t.i} data-p="priority" onchange={handleTask}>
                                            <template for:each={t.priorityOptions} for:item="p">
                                                <option key={p.value} value={p.value} selected={p.selected}>{p.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12">
                                        <input type="number" min="0" class="slds-input" data-i={t.i} data-p="offsetDays"
                                            value={t.offsetDays} onchange={handleTask} title="ימים מרגע הקבלה" placeholder="ימים" />
                                    </div>
                                    <div class="slds-col slds-size_1-of-12">
                                        <button class="slds-button slds-button_destructive" data-i={t.i} onclick={removeTask}>×</button>
                                    </div>
                                    <div class="slds-col slds-size_12-of-12 slds-p-top_xx-small">
                                        <input type="text" class="slds-input" data-i={t.i} data-p="description"
                                            value={t.description} onchange={handleTask} placeholder="תיאור המשימה (אופציונלי)" />
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Appearance / visual design -->
                <div class="slds-box slds-box_xx-small slds-m-bottom_small slds-theme_shade">
                    <span class="slds-text-title_bold">עיצוב מראה הטופס</span>
                    <div class="slds-grid slds-gutters_xx-small slds-wrap slds-p-top_x-small">
                        <div class="slds-col slds-size_6-of-12 slds-form-element">
                            <label class="slds-form-element__label">רקע סביב הטופס</label>
                            <div class="slds-select_container">
                                <select class="slds-select" onchange={handleBgType}>
                                    <template for:each={bgTypeOptions} for:item="o">
                                        <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                    </template>
                                </select>
                            </div>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-form-element">
                            <label class="slds-form-element__label">גופן</label>
                            <div class="slds-select_container">
                                <select class="slds-select" data-p="fontFamily" onchange={handleAppearance}>
                                    <template for:each={fontOptions} for:item="o">
                                        <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                    </template>
                                </select>
                            </div>
                        </div>

                        <template lwc:if={showBgColor}>
                            <div class="slds-col slds-size_6-of-12 slds-form-element">
                                <label class="slds-form-element__label">צבע רקע</label>
                                <input type="color" class="slds-input" data-p="bgColor" value={appearance.bgColor} onchange={handleAppearance} />
                            </div>
                        </template>
                        <template lwc:if={showBgColor2}>
                            <div class="slds-col slds-size_6-of-12 slds-form-element">
                                <label class="slds-form-element__label">צבע רקע שני (מעבר)</label>
                                <input type="color" class="slds-input" data-p="bgColor2" value={appearance.bgColor2} onchange={handleAppearance} />
                            </div>
                        </template>

                        <template lwc:if={showBgMedia}>
                            <div class="slds-col slds-size_12-of-12 slds-form-element slds-p-top_xx-small">
                                <label class="slds-form-element__label">{mediaLabel} — העלה קובץ או הדבק כתובת</label>
                                <input type="file" accept={mediaAccept} class="slds-input" onchange={handleMediaUpload} />
                                <template lwc:if={uploadingBg}><span class="slds-text-color_weak">מעלה…</span></template>
                                <input type="text" class="slds-input slds-m-top_xx-small" data-p="bgUrl"
                                    value={appearance.bgUrl} onchange={handleAppearance} placeholder="https://… (כתובת תמונה/סרטון)" />
                            </div>
                        </template>
                        <template lwc:if={showOverlay}>
                            <div class="slds-col slds-size_12-of-12 slds-form-element">
                                <label class="slds-form-element__label">כהות שכבת-על מעל המדיה (לקריאוּת) — {overlayPct}%</label>
                                <input type="range" min="0" max="0.8" step="0.05" data-p="overlay" value={appearance.overlay} onchange={handleAppearance} class="slds-slider__range" style="width:100%;" />
                            </div>
                        </template>

                        <div class="slds-col slds-size_4-of-12 slds-form-element">
                            <label class="slds-form-element__label">צבע כרטיס</label>
                            <input type="color" class="slds-input" data-p="cardColor" value={appearance.cardColor} onchange={handleAppearance} />
                        </div>
                        <div class="slds-col slds-size_4-of-12 slds-form-element">
                            <label class="slds-form-element__label">צבע ראשי (כפתורים)</label>
                            <input type="color" class="slds-input" data-p="accentColor" value={appearance.accentColor} onchange={handleAppearance} />
                        </div>
                        <div class="slds-col slds-size_4-of-12 slds-form-element">
                            <label class="slds-form-element__label">צבע טקסט</label>
                            <input type="color" class="slds-input" data-p="textColor" value={appearance.textColor} onchange={handleAppearance} />
                        </div>

                        <div class="slds-col slds-size_6-of-12 slds-form-element slds-p-top_xx-small">
                            <label class="slds-form-element__label">רוחב מרבי (פיקסלים)</label>
                            <input type="number" min="360" max="1200" class="slds-input" data-p="maxWidth" value={appearance.maxWidth} onchange={handleAppearance} />
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-form-element slds-p-top_xx-small">
                            <label class="slds-form-element__label">לוגו (העלה או הדבק כתובת)</label>
                            <input type="file" accept="image/*" class="slds-input" onchange={handleLogoUpload} />
                            <template lwc:if={uploadingLogo}><span class="slds-text-color_weak">מעלה…</span></template>
                            <input type="text" class="slds-input slds-m-top_xx-small" data-p="logoUrl"
                                value={appearance.logoUrl} onchange={handleAppearance} placeholder="https://… (כתובת לוגו)" />
                        </div>

                        <div class="slds-col slds-size_12-of-12 slds-p-top_x-small">
                            <label class="slds-form-element__label">תצוגה מקדימה</label>
                            <div style={previewStyle}>
                                <div style={previewCardStyle}>
                                    <template lwc:if={appearance.logoUrl}>
                                        <img src={appearance.logoUrl} alt="לוגו" style="max-height:32px;margin-bottom:6px;" />
                                    </template>
                                    <div class="slds-text-title_bold">{title}</div>
                                    <div style="font-size:0.85rem;opacity:0.8;">דוגמת טקסט בטופס</div>
                                    <button type="button" style={previewBtnStyle}>שליחה</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Steps -->
                <template for:each={stepRows} for:item="step">
                    <div key={step.index} class="slds-box slds-box_x-small slds-m-bottom_small slds-theme_shade">
                        <div class="slds-grid slds-gutters_xx-small slds-grid_vertical-align-center slds-p-bottom_x-small">
                            <div class="slds-col slds-size_2-of-12 slds-text-title_bold">{step.label}</div>
                            <div class="slds-col slds-size_8-of-12">
                                <input type="text" class="slds-input" data-s={step.index} data-p="title"
                                    value={step.title} onchange={handleStepTitle} placeholder="כותרת השלב (אופציונלי)" />
                            </div>
                            <div class="slds-col slds-size_2-of-12">
                                <template lwc:if={step.canRemove}>
                                    <button class="slds-button slds-button_destructive" data-s={step.index} onclick={removeStep}>מחק שלב</button>
                                </template>
                            </div>
                        </div>

                        <template for:each={step.fields} for:item="f">
                            <div key={f.i} class="slds-box slds-box_xx-small slds-m-bottom_x-small slds-theme_default">
                                <div class="slds-grid slds-gutters_xx-small slds-wrap slds-grid_vertical-align-center">
                                    <div class="slds-col slds-size_5-of-12">
                                        <input type="text" class="slds-input" data-s={f.s} data-i={f.i} data-p="label"
                                            value={f.label} onchange={handleField} placeholder="תווית השדה" />
                                    </div>
                                    <div class="slds-col slds-size_4-of-12">
                                        <select class="slds-select" data-s={f.s} data-i={f.i} data-p="type" onchange={handleField}>
                                            <template for:each={f.typeOptions} for:item="t">
                                                <option key={t.value} value={t.value} selected={t.selected}>{t.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12">
                                        <lightning-input type="checkbox" label="חובה" data-s={f.s} data-i={f.i} data-p="required" checked={f.required} onchange={handleField}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-12">
                                        <button class="slds-button slds-button_destructive" data-s={f.s} data-i={f.i} onclick={removeField}>×</button>
                                    </div>
                                </div>
                                <div class="slds-grid slds-gutters_xx-small slds-wrap slds-p-top_xx-small">
                                    <div class="slds-col slds-size_6-of-12">
                                        <select class="slds-select" data-s={f.s} data-i={f.i} data-p="mapTo" onchange={handleField}>
                                            <template for:each={f.mapOptions} for:item="m">
                                                <option key={m.value} value={m.value} selected={m.selected}>{m.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <template lwc:if={f.showOptions}>
                                        <div class="slds-col slds-size_6-of-12">
                                            <textarea class="slds-textarea" data-s={f.s} data-i={f.i} data-p="options"
                                                onchange={handleField} placeholder="אפשרות בכל שורה">{f.options}</textarea>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <button class="slds-button slds-button_neutral" data-s={step.index} onclick={addField}>+ הוסף שדה</button>
                    </div>
                </template>

                <button class="slds-button slds-button_neutral slds-m-top_x-small" onclick={addStep}>+ הוסף שלב</button>

                <div class="slds-p-top_medium">
                    <button class="slds-button slds-button_brand" onclick={save}>{saveLabel}</button>
                    <template lwc:if={embedded}>
                        <button class="slds-button slds-button_neutral" onclick={cancel}>חזרה לרשימה</button>
                    </template>
                </div>

                <template lwc:if={error}><div class="slds-text-color_error slds-p-top_small">{error}</div></template>
                <template lwc:if={savedMsg}>
                    <div class="slds-text-color_success slds-p-top_small">{savedMsg}</div>
                    <template lwc:if={savedUrl}>
                        <div class="slds-box slds-box_xx-small slds-m-top_x-small">
                            <div class="slds-text-title_bold">קישור ציבורי לטופס:</div>
                            <a href={savedUrl} target="_blank" class="slds-text-link">{savedUrl}</a>
                            <div class="slds-p-top_xx-small">
                                <button class="slds-button slds-button_neutral" onclick={copyUrl}>העתק קישור</button>
                            </div>
                        </div>
                    </template>
                </template>
            </div>

            <template lwc:if={notEmbedded}>
                <div class="slds-box slds-m-top_small">
                    <h2 class="slds-text-title_bold slds-p-bottom_x-small">טפסים קיימים</h2>
                    <template for:each={existing} for:item="e">
                        <div key={e.Id} class="slds-p-vertical_xxx-small">
                            {e.Name} <span class="slds-text-body_small slds-text-color_weak">· {e.External_Id__c}</span>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Live test of the saved form -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12">
            <template lwc:if={savedExternalId}>
                <div class="slds-text-title_bold slds-p-bottom_x-small">תצוגה חיה (מילוי אמיתי)</div>
                <c-dynamic-form external-id={savedExternalId}></c-dynamic-form>
            </template>
            <template lwc:else>
                <div class="slds-box slds-text-color_weak">שמור טופס כדי לראות אותו כאן ולבדוק מילוי.</div>
            </template>
        </div>
    </div>
</template>
