<template>
    <div dir="rtl">
        <lightning-card title="תוצאות טפסים" icon-name="standard:dashboard">
            <!-- LIST -->
            <template lwc:if={isList}>
                <div class="slds-p-horizontal_small slds-p-bottom_small">
                    <lightning-input class="list-search" type="search" label="חיפוש טופס" variant="label-hidden"
                        placeholder="חפש לפי שם או מזהה..." value={search} onchange={handleSearch}></lightning-input>
                </div>
                <div class="slds-p-horizontal_small slds-is-relative">
                    <template lwc:if={loading}>
                        <div role="status" aria-live="polite">
                            <lightning-spinner alternative-text="טוען תוצאות…" size="small"></lightning-spinner>
                            <span class="slds-assistive-text">טוען תוצאות…</span>
                        </div>
                    </template>
                    <template lwc:if={hasRows}>
                        <div role="region" aria-label="רשימת טפסים לצפייה בתוצאות">
                            <lightning-datatable
                                aria-label="רשימת טפסים לצפייה בתוצאות"
                                key-field="id"
                                data={rows}
                                columns={columns}
                                hide-checkbox-column
                                sorted-by={sortBy}
                                sorted-direction={sortDirection}
                                onsort={handleSort}
                                onrowaction={handleRowAction}>
                            </lightning-datatable>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-p-around_medium slds-text-align_center">אין טפסים.</p>
                    </template>
                </div>
            </template>

            <!-- DETAIL (form aggregate + record list) -->
            <template lwc:elseif={isDetail}>
                <div class="slds-p-around_small">
                    <lightning-button label="← חזרה לרשימה" variant="neutral" onclick={backToList} class="slds-m-bottom_small"></lightning-button>

                    <template lwc:if={results}>
                        <h2 class="detail-heading slds-text-heading_medium slds-p-bottom_x-small" tabindex="-1">{results.formName}</h2>

                        <!-- KPI tiles -->
                        <div class="slds-grid slds-gutters_x-small slds-wrap slds-p-bottom_small">
                            <div class="slds-col"><div class="kpi kpi-total"><div class="kpi-num">{results.total}</div><div class="kpi-lbl">סה"כ הגשות</div></div></div>
                            <div class="slds-col"><div class="kpi kpi-ok"><div class="kpi-num">{results.approved}</div><div class="kpi-lbl">אושרו</div></div></div>
                            <div class="slds-col"><div class="kpi kpi-warn"><div class="kpi-num">{results.needsInfo}</div><div class="kpi-lbl">נדרשת השלמה</div></div></div>
                            <div class="slds-col"><div class="kpi kpi-pending"><div class="kpi-num">{results.pending}</div><div class="kpi-lbl">בהמתנה/לא נבדק</div></div></div>
                            <template lwc:if={hasResponses}>
                                <div class="slds-col"><div class="kpi kpi-auto"><div class="kpi-num">{autoApproveCount}</div><div class="kpi-lbl">אישור אוטומטי</div></div></div>
                                <div class="slds-col"><div class="kpi kpi-review"><div class="kpi-num">{reviewedPctLabel}</div><div class="kpi-lbl">נבדקו ע"י AI</div></div></div>
                            </template>
                        </div>

                        <template lwc:if={noData}>
                            <p class="slds-text-color_weak slds-p-around_medium">עדיין אין הגשות לטופס זה.</p>
                        </template>

                        <template lwc:else>
                            <!-- Dashboard charts (inline CSS bars; text alternatives via aria-label) -->
                            <div class="slds-grid slds-wrap slds-gutters_small slds-p-bottom_small">
                                <!-- AI-status distribution -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                                    <div class="slds-box slds-box_x-small chart-card">
                                        <h3 class="slds-text-title_bold slds-p-bottom_x-small">התפלגות סטטוס בדיקת AI</h3>
                                        <div role="img" aria-label={statusChartAria}>
                                            <template for:each={statusChart} for:item="s">
                                                <div key={s.key} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                                                    <div class="slds-col slds-size_4-of-12 slds-truncate" title={s.label}>{s.label}</div>
                                                    <div class="slds-col slds-size_6-of-12">
                                                        <div class="hbar-track"><div class={s.cls} style={s.barStyle}></div></div>
                                                    </div>
                                                    <div class="slds-col slds-size_2-of-12 slds-text-align_left chart-val">{s.count} ({s.percent}%)</div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Approval-route distribution -->
                                <template lwc:if={hasResponses}>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                                        <div class="slds-box slds-box_x-small chart-card">
                                            <h3 class="slds-text-title_bold slds-p-bottom_x-small">התפלגות מסלולי אישור</h3>
                                            <div role="img" aria-label={routeChartAria}>
                                                <template for:each={routeChart} for:item="rc">
                                                    <div key={rc.key} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                                                        <div class="slds-col slds-size_4-of-12 slds-truncate" title={rc.label}>{rc.label}</div>
                                                        <div class="slds-col slds-size_6-of-12">
                                                            <div class="hbar-track"><div class={rc.cls} style={rc.barStyle}></div></div>
                                                        </div>
                                                        <div class="slds-col slds-size_2-of-12 slds-text-align_left chart-val">{rc.count} ({rc.percent}%)</div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- Submissions over time (only when timestamps exist) -->
                                <template lwc:if={hasTimeChart}>
                                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                        <div class="slds-box slds-box_x-small chart-card">
                                            <h3 class="slds-text-title_bold slds-p-bottom_x-small">הגשות לפי יום</h3>
                                            <div class="col-scroll">
                                                <div class="col-chart" role="img" aria-label={timeChartAria}>
                                                    <template for:each={timeChart} for:item="d">
                                                        <div key={d.key} class="col" title={d.label}>
                                                            <span class="col-count chart-val">{d.count}</span>
                                                            <div class="col-bar" style={d.barStyle}></div>
                                                            <span class="col-label">{d.label}</span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Summary / AI insights -->
                            <div class="slds-box slds-box_x-small slds-m-vertical_small slds-theme_shade" role="region" aria-labelledby="ai-insights-heading">
                                <h3 id="ai-insights-heading" class="slds-text-title_bold slds-p-bottom_xx-small">תובנות AI</h3>
                                <div style="white-space:pre-wrap;position:relative;min-height:1.5rem;">
                                    <template lwc:if={aiLoading}>
                                        <div role="status" aria-live="polite">
                                            <lightning-spinner alternative-text="מפיק תובנות…" size="small"></lightning-spinner>
                                            <span class="slds-assistive-text">מפיק תובנות…</span>
                                        </div>
                                    </template>
                                    <template lwc:if={aiText}>{aiText}</template>
                                    <template lwc:else>{results.summary}</template>
                                </div>
                                <template lwc:if={aiMeta}>
                                    <div class="slds-text-body_small slds-text-color_weak slds-p-top_xx-small">{aiMeta}</div>
                                </template>
                                <div class="slds-p-top_x-small">
                                    <lightning-button label={aiButtonLabel} title={aiButtonLabel} variant="brand" onclick={runAi} disabled={aiLoading}></lightning-button>
                                </div>
                            </div>

                            <!-- Charts per field -->
                            <template for:each={results.fields} for:item="f">
                                <div key={f.key} class="slds-box slds-box_x-small slds-m-bottom_small">
                                    <h3 class="slds-text-title_bold slds-p-bottom_xx-small">{f.label}</h3>

                                    <template lwc:if={f.isBar}>
                                        <template for:each={f.buckets} for:item="b">
                                            <div key={b.label} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                                                <div class="slds-col slds-size_3-of-12 slds-truncate" title={b.label}>{b.label}</div>
                                                <div class="slds-col slds-size_7-of-12">
                                                    <div style="background:#e5e5e5;border-radius:4px;overflow:hidden;">
                                                        <div style={b.barStyle} class="slds-p-vertical_xx-small" data-bar="1">&nbsp;</div>
                                                    </div>
                                                </div>
                                                <div class="slds-col slds-size_2-of-12 slds-text-align_left">{b.count} ({b.percent}%)</div>
                                            </div>
                                        </template>
                                    </template>

                                    <template lwc:elseif={f.isStat}>
                                        <div class="slds-grid slds-gutters_x-small slds-wrap">
                                            <div class="slds-col"><span class="slds-text-color_weak">ממוצע:</span> {f.avg}</div>
                                            <div class="slds-col"><span class="slds-text-color_weak">מינ׳:</span> {f.minV}</div>
                                            <div class="slds-col"><span class="slds-text-color_weak">מקס׳:</span> {f.maxV}</div>
                                            <div class="slds-col"><span class="slds-text-color_weak">מולא:</span> {f.filled}</div>
                                        </div>
                                    </template>

                                    <template lwc:else>
                                        <div class="slds-text-body_small slds-text-color_weak">מולא ב-{f.filled} הגשות</div>
                                    </template>
                                </div>
                            </template>

                            <!-- Individual submissions (record-level) -->
                            <div class="slds-box slds-box_x-small slds-m-top_small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-bottom_xx-small">
                                    <h3 class="slds-text-title_bold">רשומות פרטניות</h3>
                                    <template lwc:if={hasResponses}>
                                        <lightning-button label="ייצוא CSV" title="ייצוא הרשומות לקובץ CSV" icon-name="utility:download"
                                            variant="neutral" onclick={exportCsv}></lightning-button>
                                    </template>
                                </div>

                                <template lwc:if={hasResponses}>
                                    <!-- AI status color legend (color augmented by text) -->
                                    <div class="slds-text-body_small slds-p-bottom_x-small" role="group" aria-label="מקרא סטטוס AI">
                                        <span class="slds-text-color_weak">מקרא סטטוס AI: </span>
                                        <span class="slds-text-color_success slds-m-right_x-small"><span aria-hidden="true">●</span> אושר</span>
                                        <span class="slds-text-color_error slds-m-right_x-small"><span aria-hidden="true">●</span> נדרשת השלמה / שגיאה</span>
                                        <span class="slds-text-color_weak"><span aria-hidden="true">●</span> ממתין / לא נבדק</span>
                                    </div>
                                </template>

                                <template lwc:if={hasResponses}>
                                    <!-- search / status filter / sort over the loaded rows -->
                                    <div class="slds-grid slds-wrap slds-gutters_x-small slds-p-bottom_xx-small">
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                                            <lightning-input class="resp-search" type="search" label="חיפוש פנייה"
                                                variant="label-hidden" placeholder="חפש לפי שם פונה או סימוכין..."
                                                value={respSearch} onchange={handleRespSearch}></lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-medium-size_4-of-12">
                                            <lightning-combobox label="סינון לפי סטטוס AI" variant="label-hidden"
                                                value={respStatus} options={statusFilterOptions}
                                                placeholder="כל הסטטוסים" onchange={handleRespStatus}></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12">
                                            <lightning-combobox label="מיון" variant="label-hidden"
                                                value={respSort} options={sortOptions}
                                                onchange={handleRespSort}></lightning-combobox>
                                        </div>
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_weak slds-p-bottom_xx-small"
                                        role="status" aria-live="polite">{resultCountText}</div>

                                    <template lwc:if={hasFilteredResponses}>
                                        <div role="region" aria-label="רשומות פרטניות של הגשות הטופס">
                                            <lightning-datatable
                                                aria-label="רשומות פרטניות של הגשות הטופס"
                                                key-field="id"
                                                data={filteredResponses}
                                                columns={respColumns}
                                                hide-checkbox-column
                                                onrowaction={handleResponseRowAction}>
                                            </lightning-datatable>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="slds-text-color_weak slds-p-around_small">לא נמצאו פניות תואמות את החיפוש/הסינון.</p>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-color_weak slds-p-around_small">אין רשומות להצגה.</p>
                                </template>
                                <a class="csv-download slds-hide" aria-hidden="true"></a>
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <!-- SINGLE RECORD -->
            <template lwc:elseif={isRecord}>
                <div class="slds-p-around_small">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <lightning-button label="← חזרה לתוצאות" variant="neutral" onclick={backToDetail}></lightning-button>
                        <template lwc:if={record}>
                            <lightning-button label="ייצוא CSV" title="ייצוא רשומה זו לקובץ CSV" icon-name="utility:download" variant="neutral" onclick={exportRecordCsv}></lightning-button>
                        </template>
                    </div>
                    <a class="record-csv-download slds-hide" aria-hidden="true"></a>

                    <template lwc:if={recordLoading}>
                        <div role="status" aria-live="polite">
                            <lightning-spinner alternative-text="טוען רשומה…" size="small"></lightning-spinner>
                            <span class="slds-assistive-text">טוען רשומה…</span>
                        </div>
                    </template>

                    <template lwc:if={record}>
                        <h2 class="record-heading slds-text-heading_medium" tabindex="-1">{record.reference} · {record.respondentName}</h2>
                        <div class="slds-text-body_small slds-text-color_weak slds-p-bottom_small">
                            <template lwc:if={record.submittedStr}>הוגש: {record.submittedStr}</template>
                            <template lwc:if={record.email}> · {record.email}</template>
                            <template lwc:if={record.phone}> · {record.phone}</template>
                        </div>

                        <!-- Service-desk handoff (open a Case once internal prep is done) -->
                        <div class="slds-box slds-box_x-small slds-m-bottom_small" role="region" aria-label="העברה לטיפול מוקד">
                            <template lwc:if={record.hasCase}>
                                <span class="slds-text-body_regular">
                                    ✓ הפנייה הועברה לטיפול המוקד — פנייה מס׳
                                    <span class="slds-text-title_bold">{record.caseNumber}</span>
                                </span>
                            </template>
                            <template lwc:else>
                                <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                    <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">
                                        לאחר סיום הכנת המידע, ניתן לפתוח פנייה במוקד העירוני (Case) להמשך טיפול.
                                    </span>
                                    <lightning-button variant="brand" label="פתח פנייה במוקד (Case)"
                                        icon-name="utility:priority" onclick={handoffToCase}
                                        disabled={handoffBusy}></lightning-button>
                                </div>
                            </template>
                        </div>

                        <!-- AI status + findings -->
                        <div class="slds-box slds-box_x-small slds-m-bottom_small slds-theme_shade" role="region" aria-label="סטטוס בדיקת AI">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                <h3 class="slds-text-title_bold slds-m-left_small">סטטוס AI: <span class={record.aiStatusClass}>{record.aiStatusLabel}</span></h3>
                                <template lwc:if={record.approvalRoute}>
                                    <lightning-badge label={record.approvalRoute} icon-name="utility:routing_offline"></lightning-badge>
                                </template>
                            </div>
                            <template lwc:if={record.aiReviewedStr}>
                                <div class="slds-text-body_small slds-text-color_weak">נבדק: {record.aiReviewedStr}</div>
                            </template>
                            <template lwc:if={record.aiFindings}>
                                <div style="white-space:pre-wrap;" class="slds-p-top_xx-small">{record.aiFindings}</div>
                            </template>
                        </div>

                        <!-- Field values -->
                        <div class="slds-box slds-box_x-small slds-m-bottom_small">
                            <h3 class="slds-text-title_bold slds-p-bottom_x-small">פרטי ההגשה</h3>
                            <template for:each={record.fields} for:item="fv">
                                <div key={fv.label} class="slds-grid slds-p-vertical_xxx-small slds-border_bottom">
                                    <div class="slds-col slds-size_5-of-12 slds-text-color_weak slds-truncate" title={fv.label}>{fv.label}</div>
                                    <div class="slds-col slds-size_7-of-12">{fv.value}</div>
                                </div>
                            </template>
                        </div>

                        <!-- Uploaded files -->
                        <div class="slds-box slds-box_x-small slds-m-bottom_small">
                            <h3 class="slds-text-title_bold slds-p-bottom_x-small">קבצים שהועלו</h3>
                            <template lwc:if={record.hasFiles}>
                                <ul class="slds-list_vertical">
                                    <template for:each={record.files} for:item="file">
                                        <li key={file.contentDocumentId} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                                            <lightning-icon icon-name="doctype:attachment" size="x-small" alternative-text="קובץ מצורף" class="slds-m-left_x-small"></lightning-icon>
                                            <a href={file.downloadUrl} target="_blank" title="הורדת הקובץ (נפתח בכרטיסייה חדשה)" class="slds-m-right_x-small">{file.title}</a>
                                            <span class="slds-text-body_small slds-text-color_weak slds-m-right_x-small">({file.fileType})</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small slds-text-color_weak">לא צורפו קבצים להגשה זו.</p>
                            </template>
                        </div>

                        <!-- AI interaction thread with the applicant -->
                        <div class="slds-box slds-box_x-small">
                            <h3 class="slds-text-title_bold slds-p-bottom_x-small">התנהלות AI מול הפונה (טיוב נתונים)</h3>
                            <template lwc:if={record.hasInteractions}>
                                <template for:each={record.interactions} for:item="ix">
                                    <div key={ix.key} class={ix.itemClass}>
                                        <div class="slds-grid slds-grid_align-spread slds-text-body_small slds-text-color_weak slds-p-bottom_xxx-small">
                                            <span><strong>{ix.interactionType}</strong> · {ix.direction}</span>
                                            <span>{ix.occurredStr}</span>
                                        </div>
                                        <div style="white-space:pre-wrap;">{ix.message}</div>
                                    </div>
                                </template>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small slds-text-color_weak">לא בוצעה התנהלות AI על רשומה זו.</p>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </lightning-card>
    </div>
</template>
