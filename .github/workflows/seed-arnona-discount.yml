name: Seed arnona-discount form

# One-shot: runs scripts/seed-arnona-discount.apex against the target org to create
# the Ask-Once (שאל פעם אחת) "בקשה להנחה בארנונה" Form_Template__c (External_Id__c =
# 'arnona-discount', Identity_Mode = Identified) plus its ארנונה / גבייה department +
# service type. After it runs, the form appears in the forms list and at ?formId=arnona-discount.
#
# Requires the SF_AUTH_URL repository secret (same as deploy-org.yml).
# Run by bumping ops/seed-arnona-discount.trigger, or via the Actions "Run workflow" button.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: [".github/workflows/seed-arnona-discount.yml", "ops/seed-arnona-discount.trigger"]

jobs:
  seed:
    name: Seed arnona-discount template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authorize target org
        run: |
          if [ -z "${{ secrets.SF_AUTH_URL }}" ]; then
            echo "::error::Missing secret SF_AUTH_URL. See docs/DEPLOY.md."
            exit 1
          fi
          echo "${{ secrets.SF_AUTH_URL }}" > ./SF_AUTH.txt
          sf org login sfdx-url --sfdx-url-file ./SF_AUTH.txt --alias target --set-default
          rm -f ./SF_AUTH.txt

      - name: Seed arnona-discount template + routing
        run: |
          out=$(sf apex run --file scripts/seed-arnona-discount.apex --target-org target --json)
          echo "$out"
          echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin)['result']; print('compiled=', d.get('compiled'), 'success=', d.get('success')); sys.exit(0 if d.get('compiled') and d.get('success') else 1)"
