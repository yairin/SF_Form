name: List form templates

# Diagnostic one-shot: lists all Form_Template__c records + response counts.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: [".github/workflows/list-templates.yml", "ops/list-templates.trigger"]

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest
      - name: Authorize target org
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./SF_AUTH.txt
          sf org login sfdx-url --sfdx-url-file ./SF_AUTH.txt --alias target --set-default
          rm -f ./SF_AUTH.txt
      - name: List templates
        run: sf apex run --file scripts/list-templates.apex --target-org target
