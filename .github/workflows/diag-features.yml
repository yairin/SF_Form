name: Diag features
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: [".github/workflows/diag-features.yml", "ops/diag-features.trigger"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @salesforce/cli@latest
      - name: Authorize target org
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./SF_AUTH.txt
          sf org login sfdx-url --sfdx-url-file ./SF_AUTH.txt --alias target --set-default
          rm -f ./SF_AUTH.txt
      - name: Detect features
        run: sf apex run --file scripts/diag-features.apex --target-org target
