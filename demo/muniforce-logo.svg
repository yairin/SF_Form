<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-label="עיריית מוניפורס — MuniForce City">
  <defs>
    <linearGradient id="mfShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fc4"/>
      <stop offset="1" stop-color="#123f78"/>
    </linearGradient>
    <linearGradient id="mfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#cfe0f4"/>
    </linearGradient>
  </defs>

  <!-- Emblem: civic shield with a city skyline + rising sun -->
  <g transform="translate(14,10)">
    <path d="M50 2 L94 16 V52 C94 78 74 96 50 104 C26 96 6 78 6 52 V16 Z"
          fill="url(#mfShield)" stroke="#0e335f" stroke-width="2"/>
    <path d="M50 10 L86 21 V52 C86 73 70 88 50 95 C30 88 14 73 14 52 V21 Z"
          fill="url(#mfSky)"/>
    <!-- rising sun -->
    <circle cx="50" cy="44" r="10" fill="#f4a72c"/>
    <g stroke="#f4a72c" stroke-width="2.4" stroke-linecap="round">
      <line x1="50" y1="24" x2="50" y2="30"/>
      <line x1="34" y1="30" x2="38" y2="34"/>
      <line x1="66" y1="30" x2="62" y2="34"/>
    </g>
    <!-- skyline: three municipal buildings + central tower -->
    <g fill="#1c5aa8">
      <rect x="24" y="58" width="14" height="26" rx="1.5"/>
      <rect x="62" y="58" width="14" height="26" rx="1.5"/>
      <rect x="42" y="46" width="16" height="38" rx="1.5"/>
      <rect x="48.5" y="36" width="3" height="12"/>
      <circle cx="50" cy="35" r="2.4" fill="#f4a72c"/>
    </g>
    <!-- windows -->
    <g fill="#eaf2fb">
      <rect x="27" y="62" width="3" height="3"/><rect x="32" y="62" width="3" height="3"/>
      <rect x="27" y="68" width="3" height="3"/><rect x="32" y="68" width="3" height="3"/>
      <rect x="65" y="62" width="3" height="3"/><rect x="70" y="62" width="3" height="3"/>
      <rect x="65" y="68" width="3" height="3"/><rect x="70" y="68" width="3" height="3"/>
      <rect x="45" y="52" width="3.5" height="3.5"/><rect x="51.5" y="52" width="3.5" height="3.5"/>
      <rect x="45" y="60" width="3.5" height="3.5"/><rect x="51.5" y="60" width="3.5" height="3.5"/>
      <rect x="45" y="68" width="3.5" height="3.5"/><rect x="51.5" y="68" width="3.5" height="3.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(122,0)" font-family="'Rubik','Segoe UI','Assistant',Arial,sans-serif">
    <text x="0" y="52" font-size="29" font-weight="700" fill="#123f78">עיריית מוניפורס</text>
    <text x="0" y="78" font-size="17" font-weight="600" letter-spacing="1.5" fill="#1c5aa8">MUNIFORCE CITY</text>
    <text x="0" y="98" font-size="11.5" font-weight="500" fill="#5a6b82">שירותים דיגיטליים לתושב</text>
  </g>
</svg>
